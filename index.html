</style>

<body class="bgadd z-0 min-h-screen flex justify-center items-center">
   <section class=" shadow-sm w-[90vw] md:w-[33vw] bg-[#FFFFFF] mx-auto flex flex-col justify-center items-center px-[10px] md:px-[20px] py-[30px] border-t-[4px] border-solid border-purple-700 rounded-[10px]">
       <div class=" flex flex-col justify-center items-center w-[80%] space-y-2">
        <div class=" flex justify-center items-center space-x-1">
          <div class=" h-[50px] w-[50px] rounded-full flex justify-center items-center">
                <img class="rounded-[50%] h-[50px] w-[50px]" src="assets/logo.jpg" alt="logo">
          </div>
             
             <h1 class=" font-bold text-[24px] md:text-[30px] text-[#3c0350f5]">My todo <span class=" text-[#68166b]">ta<span class="text-[#f30f0f] font-extrabold">S</span>k</span> </h1>
        </div>
        <div>
          
          <p class=" text-center text-[#6e4d37f8]">List the all thing and do track of do it perfectly. It will help your growth</p>
        </div>
       </div>

         <fieldset class="flex flex-col space-y-2">
        <label class="text-[16px] text-[#6674a1] font-semibold" for="name">User name</label>
        <input class="w-full px-[3px] md:px-[3px] py-[5px] md:py-[5px] rounded-[5px] bg-gray-100" type="text" name="" id="name" placeholder="Enter your name">
        <label class="text-[16px] text-[#6674a1] font-semibold" for="password">Password</label>
        <input class="w-full px-[3px] md:px-[3px] py-[5px] md:py-[5px] rounded-[5px] bg-gray-100" type="text" name="" id="password" placeholder="Enter your password">
          <button id="sbtn" class="btn bg-[#5f255f] w-full my-[16px] text-[#FFFFFF] ">Sign in</button>
       </fieldset>
        <p> Don't have an account? <span id="signup" class="text-[18px] text-[#532bc1] underline cursor-pointer">Sign Up</span></p>
       </div>
      
       <script>
          
           document.getElementById('sbtn').addEventListener('click',
           function(){
             let getname=document.getElementById('name').value;
           let getPass=document.getElementById('password').value;
            console.log(getname);
           console.log(getPass);
             if(getname=='Arjun' && getPass=='1234'){
                  window.location.assign('\homepage.html');
           }
           else
            {
    alert('Invalid Username or Password!');
}
           })
           

       </script>
