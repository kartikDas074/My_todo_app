<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My todo app | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Geist', sans-serif;
        }
        .bg-custom {
            /* ব্যাকগ্রাউন্ড সুন্দর করার জন্য লিনিয়ার গ্রেডিয়েন্ট ওভারলে ব্যবহার করা হয়েছে */
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), 
                        url('assets/back.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
    </style>
</head>

<body class="bg-custom min-h-screen flex items-center justify-center p-4">

    <section class="bg-base-100 shadow-2xl rounded-2xl w-full max-w-md overflow-hidden border-t-8 border-[#68166b]">
        
        <div class="p-8 flex flex-col items-center">
            <div class="flex flex-col items-center mb-6">
                <img src="assets/logo.jpg" alt="logo" class="h-16 w-16 rounded-full mb-2 object-cover">
                <h1 class="text-3xl font-bold text-gray-700">My todo <span class="text-[#68166b]">taSk</span></h1>
                <p class="text-center text-sm text-gray-400 mt-2 px-4">
                    Track your tasks and boost your growth perfectly.
                </p>
            </div>

            <div class="w-full text-left mb-6">
                <h2 class="text-2xl font-bold text-[#43409d]">Sign in</h2>
            </div>

            <form class="w-full space-y-4">
                <div class="form-control w-full">
                    <label class="label" for="name">
                        <span class="label-text font-semibold text-[#6674a1]">Username</span>
                    </label>
                    <input type="text" id="name" placeholder="Enter your name" 
                           class="input input-bordered w-full bg-gray-50 focus:border-[#68166b]" />
                </div>

                <div class="form-control w-full">
                    <label class="label" for="password">
                        <span class="label-text font-semibold text-[#6674a1]">Password</span>
                    </label>
                    <input type="password" id="password" placeholder="Enter your password" 
                           class="input input-bordered w-full bg-gray-50 focus:border-[#68166b]" />
                </div>

                <button class="btn btn-primary w-full mt-4 bg-[#68166b] border-none hover:bg-[#4d0f4f] text-white">
                    Sign in
                </button>
            </form>

            <p class="mt-6 text-sm text-gray-500">
                Don't have an account? 
                <span id="signup" class="text-[#532bc1] font-bold cursor-pointer hover:underline">Sign Up</span>
            </p>
        </div>
        
    </section>

</body>
</html>
